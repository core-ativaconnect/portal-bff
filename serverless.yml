service: portal-bff
frameworkVersion: '4'
configValidationMode: error
useDotenv: true

plugins:
  - serverless-offline

custom:
  nodeEnv:
    local: development
    prd: production
  serverless-offline:
    host: localhost
    httpPort: 3001
    lambdaPort: 3002
    websocketPort: 3003
    noPrependStageInUrl: true
    reloadHandler: true
    noTimeout: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  memorySize: 1024
  timeout: 28
  logRetentionInDays: 30
  stackTags:
    Service: ${self:service}
    Stage: ${sls:stage}
    ManagedBy: ServerlessFramework
  httpApi:
    payload: '2.0'
    cors:
      allowedOrigins:
        - https://portal.tiudi.com.br
        - http://localhost:4200
        - http://localhost:5173
        - http://localhost:4173
        - ${env:PORTAL_DESK_ORIGIN, 'http://localhost:4174'}
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - POST
        - GET
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
  environment:
    NODE_ENV: ${self:custom.nodeEnv.${sls:stage}, 'production'}
    APP_STAGE: ${sls:stage}
    PORTAL_DYNAMODB_METRICS_SAMPLE_RATE: ${env:PORTAL_DYNAMODB_METRICS_SAMPLE_RATE, '0'}
    PORTAL_WORKER_FUNCTION: ${self:service}-${sls:stage}-worker
    APP_JWT_SECRET: ${env:APP_JWT_SECRET, ''}
    APP_JWT_EXPIRATION_MILLIS: ${env:APP_JWT_EXPIRATION_MILLIS, '86400000'}
    APP_DYNAMODB_ENDPOINT: ${env:APP_DYNAMODB_ENDPOINT, ''}
    APP_DYNAMODB_TABLE_PREFIX: ${env:APP_DYNAMODB_TABLE_PREFIX, ''}
    APP_ENGINE_DYNAMODB_SESSIONS_TABLE: ${env:APP_ENGINE_DYNAMODB_SESSIONS_TABLE, 'flow_engine_sessions'}
    APP_ENGINE_DYNAMODB_CONTACTS_TABLE: ${env:APP_ENGINE_DYNAMODB_CONTACTS_TABLE, 'flow_engine_contacts'}
    APP_ENGINE_DYNAMODB_MESSAGES_TABLE: ${env:APP_ENGINE_DYNAMODB_MESSAGES_TABLE, 'flow_engine_messages'}
    APP_ONBOARDING_DURATION_DAYS: ${env:APP_ONBOARDING_DURATION_DAYS, '30'}
    APP_ONBOARDING_MAX_FLOWS: ${env:APP_ONBOARDING_MAX_FLOWS, '1'}
    APP_ONBOARDING_MAX_CHANNELS: ${env:APP_ONBOARDING_MAX_CHANNELS, '1'}
    PORTAL_BOOTSTRAP_OWNER_EMAIL: ${env:PORTAL_BOOTSTRAP_OWNER_EMAIL, ''}
    APP_WHATSAPP_META_API_VERSION: ${env:APP_WHATSAPP_META_API_VERSION, 'v23.0'}
    APP_WHATSAPP_META_APP_SECRETS: ${env:APP_WHATSAPP_META_APP_SECRETS, '{}'}
    PORTAL_META_QUEUE_URL:
      Ref: MetaQueue
    PORTAL_WEBSOCKET_MANAGEMENT_ENDPOINT:
      Fn::Sub: https://${WebsocketsApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}
  iam:
    role:
      name: ${self:service}-${sls:stage}-lambda-role
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:ConditionCheckItem
          Resource:
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_DYNAMODB_TABLE_PREFIX, ''}flow_bff_*
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_DYNAMODB_TABLE_PREFIX, ''}flow_bff_*/index/*
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_SESSIONS_TABLE, 'flow_engine_sessions'}
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_SESSIONS_TABLE, 'flow_engine_sessions'}/index/*
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_CONTACTS_TABLE, 'flow_engine_contacts'}
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_CONTACTS_TABLE, 'flow_engine_contacts'}/index/*
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_MESSAGES_TABLE, 'flow_engine_messages'}
            - Fn::Sub: arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${env:APP_ENGINE_DYNAMODB_MESSAGES_TABLE, 'flow_engine_messages'}/index/*
        - Effect: Allow
          Action:
            - execute-api:ManageConnections
          Resource:
            - Fn::Sub: arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebsocketsApi}/${sls:stage}/POST/@connections/*
        - Effect: Allow
          Action:
            - sqs:SendMessage
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
          Resource:
            Fn::GetAtt: [MetaQueue, Arn]
        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - Fn::Sub: arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${self:service}-${sls:stage}-worker

functions:
  docs:
    handler: src/docs/handler.handler
    events:
      - httpApi:
          path: /docs
          method: GET
      - httpApi:
          path: /docs/{proxy+}
          method: GET
      - httpApi:
          path: /swagger
          method: GET
      - httpApi:
          path: /openapi.json
          method: GET
      - httpApi:
          path: /asyncapi.json
          method: GET
  desk:
    handler: src/desk.handler
    events:
      - httpApi:
          path: /flow-desk/api/v1/{proxy+}
          method: '*'
  metaWebhook:
    handler: src/meta-webhook.handler
    events:
      - httpApi:
          path: /v1/webhook/meta
          method: GET
      - httpApi:
          path: /v1/webhook/meta
          method: POST
  metaWorker:
    handler: src/meta-webhook.worker
    timeout: 120
    events:
      - sqs:
          arn:
            Fn::GetAtt: [MetaQueue, Arn]
          batchSize: 1
  webchat:
    handler: src/websocket.handler
    events:
      - websocket: $connect
      - websocket: $disconnect
      - websocket: $default
  worker:
    handler: src/jobs.worker
    timeout: 900
    maximumRetryAttempts: 0
    environment:
      PORTAL_AI_TIMEOUT_MS: '240000'
  commands:
    handler: src/handler.handler
    events:
      - httpApi:
          path: /commands
          method: POST


resources: ${file(infra/transports.yml)}

package:
  patterns:
    - '!docs/**'
    - '!test/**'
    - '!scripts/**'
    - '!infra/**'
    - '!.github/**'
    - '!.env*'
    - '!README.md'
