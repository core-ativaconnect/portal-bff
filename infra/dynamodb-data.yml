AWSTemplateFormatVersion: '2010-09-09'
Description: Todas as 27 tabelas do portal-bff. Recursos retidos na exclusao da stack.
Parameters:
  TablePrefix:
    Type: String
    Default: prd_
  SessionsTableName:
    Type: String
    Default: flow_engine_sessions
  ContactsTableName:
    Type: String
    Default: flow_engine_contacts
  MessagesTableName:
    Type: String
    Default: flow_engine_messages
  Stage:
    Type: String
    Default: prd
Resources:
  FlowBffWebsocketConnectionsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${TablePrefix}flow_bff_websocket_connections
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
  FlowBffBlogPostsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${TablePrefix}flow_bff_blog_posts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: admin_sort
          AttributeType: S
        - AttributeName: all_key
          AttributeType: S
        - AttributeName: public_sort
          AttributeType: S
        - AttributeName: slug
          AttributeType: S
        - AttributeName: status_key
          AttributeType: S
      KeySchema:
        - AttributeName: slug
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: ef_apllication
          Value: broker
        - Key: Service
          Value: portal-bff
        - Key: Stage
          Value:
            Ref: Stage
        - Key: ManagedBy
          Value: CloudFormation
      GlobalSecondaryIndexes:
        - IndexName: all_admin-index
          KeySchema:
            - AttributeName: all_key
              KeyType: HASH
            - AttributeName: admin_sort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: status_public-index
          KeySchema:
            - AttributeName: status_key
              KeyType: HASH
            - AttributeName: public_sort
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
  FlowBffBlogSettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${TablePrefix}flow_bff_blog_settings
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: ef_apllication
          Value: broker
        - Key: Service
          Value: portal-bff
        - Key: Stage
          Value:
            Ref: Stage
        - Key: ManagedBy
          Value: CloudFormation
  FlowBffContractAccessTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName:
        Fn::Sub: ${TablePrefix}flow_bff_contract_access
