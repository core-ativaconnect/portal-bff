        - AttributeName: added_at_sort
          AttributeType: S
        - AttributeName: contract_key
          AttributeType: S
        - AttributeName: id
          AttributeType: S
        - AttributeName: user_key
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: ef_apllication
          Value: broker
        - Key: Service
          Value: portal-bff
        - Key: Stage
          Value:
            Ref: Stage
        - Key: ManagedBy
          Value: CloudFormation
      GlobalSecondaryIndexes:
        - IndexName: contract_time-index
          KeySchema:
