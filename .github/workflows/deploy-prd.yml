name: Deploy portal-bff - PRD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: portal-bff-prd
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  STAGE: prd
  SLS_AWS_SDK: '3'
  APP_JWT_EXPIRATION_MILLIS: '86400000'
  APP_DYNAMODB_TABLE_PREFIX: 'prd_'
  APP_ENGINE_DYNAMODB_SESSIONS_TABLE: flow_engine_sessions
  APP_ENGINE_DYNAMODB_CONTACTS_TABLE: flow_engine_contacts
  APP_ENGINE_DYNAMODB_MESSAGES_TABLE: flow_engine_messages
  APP_ONBOARDING_DURATION_DAYS: '30'
  APP_ONBOARDING_MAX_FLOWS: '1'
  APP_ONBOARDING_MAX_CHANNELS: '1'
  APP_WHATSAPP_META_API_VERSION: v23.0

jobs:
  validate:
    name: Testes e validacao
    runs-on: ubuntu-latest
    services:
      dynamodb:
        image: amazon/dynamodb-local:latest
        ports:
          - 8000:8000
    env:
      APP_STAGE: local
      APP_DYNAMODB_ENDPOINT: http://localhost:8000
      RUN_DYNAMODB_TESTS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Validar sintaxe
        run: npm run check

      - name: Iniciar DynamoDB e Offline
        run: |
          npm run init:local
          npm run start:local > /tmp/portal-offline.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS -X POST http://localhost:3001/commands -H 'Content-Type: application/json' -d '{"path":"/actuator/health","method":"GET"}' >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/portal-offline.log
          exit 1

      - name: Executar testes
        env:
          RUN_OFFLINE_TESTS: '1'
        run: npm test

  deploy:
    name: Deploy AWS
    needs: validate
    runs-on: ubuntu-latest
    environment: prd
    timeout-minutes: 45
    steps:
      - name: Validar configuracao OIDC
        shell: bash
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [[ -z "$AWS_DEPLOY_ROLE_ARN" ]]; then
            echo '::error::Configure AWS_DEPLOY_ROLE_ARN em Settings > Environments > prd > Environment variables (nao em Secrets). Use o output GitHubActionsDeployRoleArn da stack portal-bff-github-bootstrap.'
            exit 1
          fi
          if [[ ! "$AWS_DEPLOY_ROLE_ARN" =~ ^arn:aws[a-z-]*:iam::[0-9]{12}:role/.+$ ]]; then
            echo '::error::AWS_DEPLOY_ROLE_ARN deve conter o ARN completo da IAM role, no formato arn:aws:iam::123456789012:role/portal-bff-github-actions-deploy.'
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Autenticar na AWS via OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: portal-bff-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Confirmar identidade AWS
        run: aws sts get-caller-identity

      - name: Criar ou atualizar tabelas DynamoDB
        run: |
          aws cloudformation deploy \
            --stack-name "portal-bff-data-$STAGE" \
            --template-file infra/dynamodb-data.yml \
            --region "$AWS_REGION" \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              "TablePrefix=$APP_DYNAMODB_TABLE_PREFIX" \
              "SessionsTableName=$APP_ENGINE_DYNAMODB_SESSIONS_TABLE" \
              "ContactsTableName=$APP_ENGINE_DYNAMODB_CONTACTS_TABLE" \
              "MessagesTableName=$APP_ENGINE_DYNAMODB_MESSAGES_TABLE" \
              "Stage=$STAGE"

      - name: Validar tabelas DynamoDB provisionadas
        run: npm run check:aws:tables

      - name: Deploy CloudFormation via Serverless Framework
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_WHATSAPP_META_APP_SECRETS: ${{ secrets.APP_WHATSAPP_META_APP_SECRETS }}
          PORTAL_DESK_ORIGIN: ${{ vars.PORTAL_DESK_ORIGIN || 'http://localhost:4174' }}
        run: npx serverless deploy --stage "$STAGE" --region "$AWS_REGION" --verbose

      - name: Mostrar endpoints e stack
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_WHATSAPP_META_APP_SECRETS: ${{ secrets.APP_WHATSAPP_META_APP_SECRETS }}
          PORTAL_DESK_ORIGIN: ${{ vars.PORTAL_DESK_ORIGIN || 'http://localhost:4174' }}
        run: |
          npx serverless info --stage "$STAGE" --region "$AWS_REGION" --verbose | tee deploy-info.txt
          {
            echo '## portal-bff PRD'
            echo '```text'
            cat deploy-info.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
